<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MaxPoll">
  <!--
    The product in one glyph: three bars, the leader in gold.

    Dark even though the site is light — DECISIONS D15. A homescreen icon and a
    browser tab sit on someone else's wallpaper, not on our page, so this follows
    the app's *chrome* (#0B1020, the same near-black the share cards use) rather
    than its paper. A near-white icon disappears on a light homescreen.

    Geometry is identical to app/favicon.ico, which is generated from the same
    numbers — bars at y 15.0 / 27.5 / 40.0, height 9.3, left edge 13.1. The bars
    are much chunkier than a "correct" scaled-down chart would be: at 16px the
    thin version collapsed into a grey smear. If you change one, change both.

    Gold is rank 1 only, here as everywhere.
  -->
  <rect width="64" height="64" rx="15" fill="#0B1020"/>
  <rect x="13.1" y="15.0" width="37.8" height="9.3" rx="4.65" fill="#F0BE4A"/>
  <rect x="13.1" y="27.5" width="26.6" height="9.3" rx="4.65" fill="#FFFFFF" opacity=".82"/>
  <rect x="13.1" y="40.0" width="17.3" height="9.3" rx="4.65" fill="#FFFFFF" opacity=".45"/>
</svg>
